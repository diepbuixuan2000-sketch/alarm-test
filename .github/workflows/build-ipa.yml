name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Archive (Unsigned for Sideloading)
        run: |
          xcodebuild -project AlarmTestApp.xcodeproj \
            -scheme AlarmTestApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AlarmTestApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/AlarmTestApp.xcarchive/Products/Applications/AlarmTestApp.app Payload/
          zip -r -9 AlarmTestApp.ipa Payload
          ls -lh AlarmTestApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmTestApp-IPA
          path: AlarmTestApp.ipa
          retention-days: 14
